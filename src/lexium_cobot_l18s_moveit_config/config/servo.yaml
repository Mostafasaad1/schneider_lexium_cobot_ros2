###############################################
# MoveIt 2 Servo Configuration for Lexium L18S
###############################################
update_period: 0.01

moveit_servo:
  move_group_name: lexium_arm

  # What type of incoming command? "speed_units" (m/s, rad/s) or "unitless" ([-1:1] e.g. joystick)
  command_in_type: speed_units

  # Scaling factors
  scale:
    linear: 0.3          # Max linear velocity [m/s]
    rotational: 0.6      # Max angular velocity [rad/s]
    joint: 0.5           # Max joint speed scale

  # Command output
  publish_period: 0.01   # 100 Hz output rate
  max_expected_latency: 0.1
  command_out_type: trajectory_msgs/JointTrajectory
  command_out_topic: /arm_controller/joint_trajectory

  # Output details
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_accelerations: false

  # Topics
  joint_topic: /joint_states
  monitored_planning_scene_topic: /planning_scene
  status_topic: ~/status
  cartesian_command_in_topic: ~/delta_twist_cmds
  joint_command_in_topic: ~/delta_joint_cmds
  pose_command_in_topic: ~/pose_target_cmds

  # Collision checking
  check_collisions: true
  collision_check_rate: 10.0
  self_collision_proximity_threshold: 0.015
  scene_collision_proximity_threshold: 0.025

  # Singularity avoidance
  lower_singularity_threshold: 15.0
  hard_stop_singularity_threshold: 30.0
  leaving_singularity_threshold_multiplier: 2.0

  # Joint limits margin (buffer before reaching physical limit)
  joint_limit_margins:
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.08

  # Signal smoothing
  use_smoothing: false

  # Planning scene ownership (false if move_group is running)
  is_primary_planning_scene_monitor: false
