controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - l_Base_Link002__to__l_Link_012
      - l_Link_012__to__l_Link_013
      - l_Link_013__to__l_Link_014
      - l_Link_014__to__l_Link_015
      - l_Link_015__to__l_Link_016
      - l_Link_016__to__l_Link_017
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    interpolate_from_desired_state: true

gripper_controller:
  ros__parameters:
    joint: gripper_finger_left_joint
    goal_tolerance: 0.005
    action_monitor_rate: 20.0
